name: Aggiorna calendario Toscana
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'requirements.txt'
      - '.github/workflows/aggiorna.yml'
permissions:
  contents: write
concurrency:
  group: calendario-toscana
  cancel-in-progress: false
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Installa dipendenze
        run: python -m pip install -r requirements.txt
      - name: Verifica comportamento
        run: python -m unittest -v
      - name: Leggi il sito e valida il calendario
        run: python aggiorna.py
      - name: Pubblica solo un aggiornamento completo e valido
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add eventi.json eventi_toscana.ics EVENTI.md DA_VERIFICARE.md stato.json
          if ! git diff --cached --quiet; then
            git commit -m 'Aggiorna calendario e stato del controllo'
            git push
          fi
      - name: Riepilogo
        if: success()
        run: |
          cat DA_VERIFICARE.md >> "$GITHUB_STEP_SUMMARY"
          printf '\nUltimo controllo: ' >> "$GITHUB_STEP_SUMMARY"
          python -c "import json; print(json.load(open('stato.json'))['last_success_utc'])" >> "$GITHUB_STEP_SUMMARY"
